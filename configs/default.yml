repository: any

# Разрешённые коды проектов Jira (префикс ключа, например APP).
# Пустой список — без ограничений.
allowed_jira_projects: []

# Маппинг логинов GitVerse → username в Telegram (без @).
# gitverse_login: telegram_username
telegram_tags:
  tmukhortova: katiadeo
  aviktorov: viktorov616
  avikharev: Groad9
  kvolkov: screwpassenger
  aalavrenov: innokentykedrov
  nsmirnova: Zig_Zaggggg

# Доступные события - ТОЛЬКО ДЛЯ СПРАВКИ
available_events:
  - type: pull_request.opened
    description: PR открыт

  - type: pull_request.closed
    description: PR закрыт

  - type: pull_request.edited
    description: PR обновлен

  - type: pull_request.synchronized
    description: PR синхронизирован, обычно при пуше новых комитов в ветку

  - type: pull_request.review_requested
    description: Запрошено ревью PR

  - type: pull_request.review_request_removed
    description: Ревьювер снят с PR

  - type: pull_request.review_approved
    description: PR одобрен

  - type: pull_request.review_rejected
    description: Запрошены правки для PR

  - type: pull_request.review_comment
    description: Для PR оставлен комментарий, самого комментария не содержит

  - type: pull_request.comment
    description: Для PR или issue оставлен комментарий

  - type: branch.push
    description: Ветка обновлена

  - type: branch.created
    description: Создана новая ветка

  - type: branch.deleted
    description: Ветка удалена

  - type: cicd.status
    description: Обновление состояния cicd (pending / success / failure)

# Доступные действия - ТОЛЬКО ДЛЯ СПРАВКИ
available_actions:
  - type: jira.comment_issue
    description: Создает комментарии для каждой задачи, упомянутой в событии

  - type: jira.mention_at_web
    description: Добавляет ссылку (mentioned in) на PR к каждой задаче из события

  - type: gitverse.create_comment
    description: Создает комментарий в PR Gitverse (например, со ссылками на связанные Jira-задачи)

  - type: telegram.notify
    description: Отправляет сообщение в telegram

  - type: utils.log
    description: Просто логирует основную информацию о событии

# События, которые нужно группировать перед обработкой.
# GitVerse в review_requested обычно не присылает имя ревьювера и не шлёт
# отдельный ивент на снятие. Ждём 60с, потом enricher читает актуальный
# список requested_reviewers из API.
event_groups:
  - key: events_group
    group_by: group.pull_request
    strategy: strategy.use_last_event
    event: pull_request.review_requested
    size: 99
    ttl: 60

# Список действий, выполняемых при получении событий
action_rules:
  - on: pull_request.opened
    action: jira.comment_issue
    template: jira/pr_opened

  - on: pull_request.opened
    action: jira.mention_at_web

  - on: pull_request.opened
    action: gitverse.create_comment
    template: gitverse/jira_issues

  - on: pull_request.opened
    action: telegram.notify
    template: telegram/pr_opened

  - on: pull_request.edited
    action: telegram.notify
    template: telegram/pr_opened

  - on: pull_request.closed
    action: telegram.notify
    template: telegram/pr_merged

  - on: pull_request.review_requested
    action: telegram.notify
    template: telegram/review_requested

  - on: pull_request.review_request_removed
    action: telegram.notify
    template: telegram/review_requested

  - on: pull_request.review_approved
    action: telegram.notify
    template: telegram/review_approved

  - on: pull_request.review_rejected
    action: telegram.notify
    template: telegram/review_rejected

  - on: pull_request.comment
    action: telegram.notify
    skip_empty: true # Пропускать уведомление, если тело комментария пустое
    template: telegram/pr_comment

  - on: branch.push
    branch: main
    action: telegram.notify
    template: telegram/branch_push

  - on: branch.created
    action: jira.comment_issue
    template: jira/branch_created

  # branch.created в Telegram отключён — шумело при каждой feature-ветке.
  # - on: branch.created
  #   action: telegram.notify
  #   template: telegram/branch_created

  - on: pull_request.closed
    action: utils.log

  - on: pull_request.synchronized
    action: utils.log

  - on: branch.deleted
    action: utils.log

  - on: pull_request.review_rejected
    action: utils.log

  - on: pull_request.review_comment
    action: utils.log

  - on: cicd.status
    action: utils.log
    cicd_context: rspec
    cicd_state: failure
